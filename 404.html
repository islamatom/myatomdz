<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ATOM</title>
<script>
// anciennes pages d'atomdz.com (WordPress) -> la bonne partie du nouveau site
var p = location.pathname.toLowerCase(), to = '/';
if (/packages|atom-pro-max|subscription|abonnement/.test(p)) to = '/#abonnements';
else if (/atom-s3|atom-s2|remote|product|shop|cart|checkout/.test(p)) to = '/#produits';
else if (/help|faq/.test(p)) to = '/#faq';
else if (/contact/.test(p)) to = '/#magasins';
location.replace(to + location.search);
</script>
